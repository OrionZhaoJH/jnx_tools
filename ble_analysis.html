<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLE 分析工具</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#f5f7fa; --surface:#ffffff; --border:#e2e8f0;
    --text:#1e293b; --text-muted:#64748b; --text-light:#94a3b8;
    --accent:#3b82f6; --accent-soft:#eff6ff;
    --ble-color:#6366f1; --ble-soft:#eef2ff;
    --danger:#ef4444; --success:#10b981; --warn:#f59e0b;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
    --radius:12px;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    padding:24px; line-height:1.6;
  }
  .container{max-width:1240px;margin:0 auto;}

  /* ---- Nav ---- */
  .nav-back{
    display:inline-flex;align-items:center;gap:6px;
    color:var(--text-muted);font-size:.875rem;text-decoration:none;
    margin-bottom:16px;transition:color .2s;
  }
  .nav-back:hover{color:var(--accent);}

  /* ---- Sticky top bar（与 JNA / JNA_Plus / JNB / JNC 工具统一：
       左「返回首页」+ 滚动后收进来的标题，右「连接/断开/清除缓存」；滚动后毛玻璃 ----） */
  .topbar{
    position:sticky;top:0;z-index:70;
    display:flex;align-items:center;justify-content:space-between;gap:10px 12px;
    flex-wrap:wrap;
    padding:10px 0;margin:0 0 16px;
    background:transparent;
    transition:background .3s ease,box-shadow .3s ease,padding .3s ease,margin .3s ease,border-radius .3s ease;
  }
  .topbar.scrolled{
    background:rgba(245,247,250,.88);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 1px 0 rgba(15,23,42,.08);
    padding:8px 14px;margin:0 -14px 16px;border-radius:12px;
  }
  .topbar-left{display:flex;align-items:center;gap:14px;min-width:0;flex:1 1 auto;}
  .topbar-left .nav-back{margin-bottom:0;flex:none;}
  .topbar-title{
    display:inline-flex;align-items:center;gap:6px;
    font-size:1rem;font-weight:600;color:var(--text);white-space:nowrap;
    opacity:0;transform:translateX(-10px);max-width:0;overflow:hidden;
    transition:opacity .3s ease,transform .3s ease,max-width .35s ease;
  }
  .topbar.scrolled .topbar-title{opacity:1;transform:translateX(0);max-width:260px;}
  .topbar-title .icon{font-size:1.05rem;}
  .topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:auto;flex-wrap:wrap;justify-content:flex-end;}
  @media(max-width:560px){
    .topbar-right{width:100%;margin-left:0;justify-content:flex-start;}
    .topbar-right .btn{padding:6px 12px;font-size:.8rem;}
  }

  header{margin-bottom:20px;}
  header h1{font-size:1.75rem;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;}
  header h1 .icon{font-size:1.5rem;}
  header p{color:var(--text-muted);margin-top:4px;font-size:.95rem;}

  /* ---- Shared components ---- */
  .btn{
    padding:8px 18px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);
    color:var(--text);font-size:.875rem;font-weight:500;cursor:pointer;transition:all .2s;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn:disabled:hover{border-color:var(--border);color:var(--text);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:#2563eb;border-color:#2563eb;color:#fff;}
  .btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;}
  .btn-danger:hover{background:#dc2626;border-color:#dc2626;color:#fff;}
  .btn-sm{padding:4px 12px;font-size:.8rem;}

  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;}
  .card-title{font-size:1.05rem;font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}

  /* ---- BLE page ---- */
  .ble-grid{display:grid;grid-template-columns:320px 1fr;gap:20px;margin-top:16px;}
  @media(max-width:900px){.ble-grid{grid-template-columns:1fr;}}

  .ble-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .name-filter{display:flex;align-items:center;gap:6px;}
  .name-filter label{font-size:.825rem;color:var(--text-muted);white-space:nowrap;}
  .name-filter input{
    padding:6px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);
    font-size:.875rem;color:var(--text);width:180px;transition:all .2s;outline:none;
  }
  .name-filter input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .name-filter input::placeholder{color:var(--text-light);}
  .status-badge{
    display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:20px;
    font-size:.825rem;font-weight:500;
  }
  .status-badge .status-dot{width:8px;height:8px;border-radius:50%;}
  .status-badge.disconnected{background:#f1f5f9;color:var(--text-muted);}
  .status-badge.disconnected .status-dot{background:var(--text-light);}
  .status-badge.connecting{background:#fef3c7;color:#92400e;}
  .status-badge.connecting .status-dot{background:var(--warn);animation:pulse 1s infinite;}
  .status-badge.connected{background:#d1fae5;color:#065f46;}
  .status-badge.connected .status-dot{background:var(--success);}
  /* 「已连接」但特征还在发现中：绿色底但点闪烁，明确区分「链路通了」与「工具就绪」 */
  .status-badge.connected.discovering .status-dot{background:var(--warn);animation:pulse 1s infinite;}
  /* 「已连接但特征缺失」：灰色底 + 琥珀点，不误报成功 */
  .status-badge.partial{background:#f1f5f9;color:#92400e;}
  .status-badge.partial .status-dot{background:var(--warn);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  /* 小型 spinner：用于按钮内「发现特征中」的旋转指示 */
  .spinner{
    display:inline-block;width:11px;height:11px;vertical-align:-1px;
    border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  /* 特征重试提示条：只在进行/失败时显示，成功后自动隐藏，不占常驻空间 */
  .ble-notice{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin:0 0 12px;padding:9px 14px;border-radius:10px;
    font-size:.85rem;line-height:1.5;
    background:#fffbeb;border:1px solid #fde68a;color:#92400e;
  }
  .ble-notice[hidden]{display:none;}
  .ble-notice .notice-text{flex:1 1 220px;min-width:0;}
  .ble-notice .btn{flex:none;}
  .device-name{font-size:.875rem;color:var(--text-muted);}
  .device-name strong{color:var(--text);}

  .ble-warning{
    background:#fef3c7;border:1px solid #fcd34d;border-radius:var(--radius);
    padding:14px 18px;margin-bottom:16px;font-size:.875rem;color:#92400e;
    display:none;
  }
  .ble-warning.show{display:block;}

  /* GATT tree */
  .gatt-tree{max-height:520px;overflow-y:auto;}
  .gatt-service{margin-bottom:8px;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .gatt-service-header{
    padding:10px 14px;background:var(--bg);font-weight:600;font-size:.85rem;cursor:pointer;
    display:flex;align-items:center;gap:8px;user-select:none;
  }
  .gatt-service-header:hover{background:var(--accent-soft);}
  .gatt-service-header .arrow{transition:transform .2s;font-size:.75rem;color:var(--text-muted);}
  .gatt-service.expanded .gatt-service-header .arrow{transform:rotate(90deg);}
  .gatt-service-body{display:none;padding:4px 0;}
  .gatt-service.expanded .gatt-service-body{display:block;}
  .gatt-char{
    padding:8px 14px 8px 36px;font-size:.825rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    border-top:1px solid var(--bg);
  }
  .gatt-char .char-uuid{font-family:'Consolas','Monaco',monospace;font-weight:600;color:var(--ble-color);}
  .char-prop{
    display:inline-block;padding:1px 8px;border-radius:10px;font-size:.7rem;font-weight:500;
  }
  .char-prop.read{background:#dbeafe;color:#1e40af;}
  .char-prop.write{background:#fef3c7;color:#92400e;}
  .char-prop.notify{background:#d1fae5;color:#065f46;}
  .char-prop.indicate{background:#e0e7ff;color:#3730a3;}
  .char-prop.other{background:#f1f5f9;color:var(--text-muted);}
  .poll-interval{
    width:52px;padding:2px 4px;border:1px solid var(--border);border-radius:4px;
    font-size:.75rem;font-family:'Consolas','Monaco',monospace;text-align:center;
  }
  .poll-ms{font-size:.7rem;color:var(--text-muted);}

  /* Raw log */
  .ble-right{display:flex;flex-direction:column;gap:16px;}
  .raw-log{
    background:#1e293b;color:#a5b4fc;border-radius:8px;padding:12px 14px;
    font-family:'Consolas','Monaco',monospace;font-size:.78rem;line-height:1.5;
    max-height:520px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;
  }
  .raw-log:empty::before{content:'等待数据... (通知 / 读取 / 订阅结果均显示在此)';color:#64748b;}
  /* 日志按方向着色 */
  .log-line{white-space:pre-wrap;word-break:break-all;padding:1px 0;}
  .log-out{color:#86efac;}   /* 发送 (Req) — 绿 */
  .log-in{color:#a5b4fc;}    /* 接收 (Data/Raw/Notify) — 靛蓝 */
  .log-err{color:#fca5a5;}   /* 错误 — 红 */
  .log-sys{color:#94a3b8;}   /* 系统/状态 (CMD/Sub) — 灰 */
  .log-legend{display:flex;gap:14px;align-items:center;font-size:.75rem;color:var(--text-muted);font-weight:400;}
  .log-legend span{display:inline-flex;align-items:center;gap:4px;}
  .log-legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}
  .lg-out{background:#86efac;}
  .lg-in{background:#a5b4fc;}
  .lg-err{background:#fca5a5;}

  footer{text-align:center;margin-top:32px;color:var(--text-light);font-size:.8rem;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-light);}
  .raw-log::-webkit-scrollbar-thumb{background:#475569;}
</style>
</head>
<body>
<div class="container">
  <!-- 顶部吸顶条（与 JNA / JNA_Plus / JNB / JNC 工具统一布局） -->
  <div class="topbar" id="topbar">
    <div class="topbar-left">
      <a href="./index.html" class="nav-back">← 返回首页</a>
      <span class="topbar-title"><span class="icon">🔵</span> BLE 分析工具</span>
    </div>
    <div class="topbar-right">
      <button class="btn btn-primary" id="btnConnect"><span>🔗</span> 连接 BLE 设备</button>
      <button class="btn btn-danger" id="btnDisconnect" disabled><span>⏏️</span> 断开</button>
      <button class="btn" id="btnClearCache" disabled><span>🧹</span> 清除缓存</button>
    </div>
  </div>

  <header>
    <h1><span class="icon">🔵</span> BLE 分析工具</h1>
    <p>通过 Web Bluetooth API 实时连接 BLE 设备，采集并记录数据。</p>
  </header>

  <div class="ble-warning" id="bleWarning">
    ⚠️ 当前浏览器不支持 Web Bluetooth API。请使用 Chrome、Edge 或 Opera（需 HTTPS 或 localhost 访问）。
  </div>

  <!-- 连接设置行：名称过滤 + 连接状态 + 设备名（普通行，不吸顶；吸顶由顶部 .topbar 负责） -->
  <div class="ble-toolbar">
    <div class="name-filter">
      <label for="nameFilter">名称过滤</label>
      <input type="text" id="nameFilter" placeholder="设备名前缀，如 JN" value="JN" autocomplete="off">
    </div>
    <div class="status-badge disconnected" id="bleStatus">
      <span class="status-dot"></span><span id="bleStatusText">未连接</span>
    </div>
    <span class="device-name" id="bleDeviceName"></span>
  </div>

  <!-- 连接/发现过程提示条：仅在进行中或失败时出现，成功后自动隐藏 -->
  <div class="ble-notice" id="bleNotice" hidden>
    <span class="notice-text" id="bleNoticeText"></span>
    <button class="btn btn-sm" id="btnRetryDiscover" type="button">重试发现特征</button>
  </div>

  <div class="ble-grid">
    <!-- Left: GATT Profile -->
    <div class="card">
      <div class="card-title">GATT Profile</div>
      <div class="gatt-tree" id="gattTree">
        <div style="color:var(--text-light);text-align:center;padding:40px 0;font-size:.875rem;">
          连接设备后将显示 GATT 服务与特征值
        </div>
      </div>
    </div>

    <!-- Right: Data Log -->
    <div class="ble-right">
      <div class="card">
        <div class="card-title">
          <span>数据日志</span>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <div class="log-legend" title="颜色说明">
              <span><i class="lg-out"></i>发送</span>
              <span><i class="lg-in"></i>接收</span>
              <span><i class="lg-err"></i>错误</span>
            </div>
            <span style="font-size:.825rem;color:var(--text-muted);"><span id="logLineCount">0</span> 行</span>
            <button class="btn btn-sm" id="btnClearLog">清空</button>
            <button class="btn btn-sm" id="btnExportLog" disabled>导出</button>
          </div>
        </div>
        <div class="raw-log" id="rawLog"></div>
      </div>
    </div>
  </div>

  <footer>BLE 分析工具 · 实时采集 · 数据均在本地处理</footer>
</div>

<script>
/* ================================================================
 *  Shared Utilities
 * ================================================================ */
const Utils = {
  escapeHtml(str){
    const d=document.createElement('div');d.textContent=str;return d.innerHTML;
  },
  formatUuid(uuid){
    const known={
      '00001800-0000-1000-8000-00805f9b34fb':'Generic Access',
      '00001801-0000-1000-8000-00805f9b34fb':'Generic Attribute',
      '0000180a-0000-1000-8000-00805f9b34fb':'Device Information',
      '0000ffe0-0000-1000-8000-00805f9b34fb':'FFE0',
      '0000ffe1-0000-1000-8000-00805f9b34fb':'FFE1 (Serial)',
      '0000ffe2-0000-1000-8000-00805f9b34fb':'FFE2',
    };
    return known[uuid]||uuid;
  },
  shortUuid(uuid){
    const m=uuid.match(/^0000([0-9a-f]{4})-0000-1000-8000-00805f9b34fb$/i);
    return m?'0x'+m[1].toUpperCase():uuid;
  },
};

/* ================================================================
 *  BLE Real-time  (isolated IIFE)
 * ================================================================ */
(function(){
  // Elements
  const btnConnect=document.getElementById('btnConnect');
  const btnDisconnect=document.getElementById('btnDisconnect');
  const bleStatus=document.getElementById('bleStatus');
  const bleStatusText=document.getElementById('bleStatusText');
  const bleDeviceName=document.getElementById('bleDeviceName');
  const bleWarning=document.getElementById('bleWarning');
  const gattTree=document.getElementById('gattTree');
  const rawLog=document.getElementById('rawLog');
  const logLineCount=document.getElementById('logLineCount');
  const btnClearLog=document.getElementById('btnClearLog');
  const btnExportLog=document.getElementById('btnExportLog');
  const nameFilter=document.getElementById('nameFilter');
  const btnClearCache=document.getElementById('btnClearCache');
  const bleNotice=document.getElementById('bleNotice');
  const bleNoticeText=document.getElementById('bleNoticeText');
  const btnRetryDiscover=document.getElementById('btnRetryDiscover');

  // State
  let device=null, server=null;
  let lastDevice=null; // 断开后仍保留引用，供"清除缓存"使用
  let bleBuffer='';
  let bleRawLines=[];
  const activePolls=new Map(); // characteristic -> intervalId（轮询）
  const activeSubs=new Map();  // characteristic -> notify handler（真正订阅）
  const MAX_RAW=500;
  const FFE1_SERVICE='0000ffe1-0000-1000-8000-00805f9b34fb';
  const COMMON_SERVICES=['generic_access','generic_attribute','device_information',FFE1_SERVICE,'0000ffe0-0000-1000-8000-00805f9b34fb'];

  /* ---- 蓝牙连接稳定性参数 ------------------------------------------------
   * Web Bluetooth 有两个已知的脆弱点，症状分别是：
   *   ① gatt.connect() 返回成功，但服务树尚未就绪 → getPrimaryServices() 首次枚举不全
   *      （表现为「连上了却找不到 FFE1/FFE2」）；
   *   ② 刚连上就立刻触发 gattserverdisconnected（表现为「连上立刻又断开，无事发生」）。
   * 两者同源：链路刚建立时的时序抖动。对策：
   *   - 建链与特征发现各自独立重试（不再一次失败就判死刑）；
   *   - connect() 成功后先 settle 一小会儿再枚举，避开服务树未就绪窗口；
   *   - 永远只枚举一次服务树再本地匹配，避免"每个特征各枚举一遍"放大抖动；
   *   - 意外掉线**不自动重连**（用户明确要求手动重连），复位 UI 但保留 device 引用；
   *   - 全过程用提示条 + 状态徽章显式反馈，杜绝静默失败。
   * ---------------------------------------------------------------------- */
  const CONNECT_ATTEMPTS=4;                       // GATT 建链尝试次数
  const CONNECT_RETRY_DELAYS=[300,700,1200];      // 每次失败后的等待(ms)
  const DISCOVER_SETTLE_MS=120;                   // 建链成功后等多久再枚举服务树
  const DISCOVER_ATTEMPTS=3;                      // 特征发现尝试次数
  const DISCOVER_RETRY_DELAYS=[200,450];          // 每次发现失败后的等待(ms)
  let connecting=false;        // 正在建立连接
  // 注：掉线后不自动重连（用户要求手动重连），故无 reconnecting 标志。
  let userDisconnect=false;    // 主动断开标志：只有它才释放 device
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));

  // Check support
  if(!navigator.bluetooth){
    bleWarning.classList.add('show');
    btnConnect.disabled=true;
  }

  // ---- 提示条 / 状态 / 按钮 ----
  function showBleNotice(text, showRetry){
    if(!text){ bleNotice.hidden=true; bleNoticeText.textContent=''; return; }
    bleNoticeText.textContent=text;
    btnRetryDiscover.hidden=!showRetry;
    bleNotice.hidden=false;
  }
  function syncConnectButtons(){
    const linked=!!(device&&device.gatt&&device.gatt.connected);
    btnConnect.disabled=connecting||linked;
    btnDisconnect.disabled=!linked;
    btnClearCache.disabled=!lastDevice;
  }

  // ---- Connect ----
  btnConnect.addEventListener('click', async ()=>{
    if(connecting) return;
    connecting=true;
    userDisconnect=false;
    syncConnectButtons();
    showBleNotice('');
    try{
      const keyword=nameFilter.value.trim();
      // 每次点「连接」都重新弹设备选择窗口（用户明确要求：每次都自己选设备）。
      // 因此这里先无条件清掉旧引用，不使用任何"静默重连"路径。
      showBleNotice('请在弹出的窗口中选择要连接的设备…');
      if(device){
        try{ device.removeEventListener('gattserverdisconnected',onGattDisconnected); }catch(e){}
      }
      device=null;
      server=null;
      // 使用 namePrefix 过滤：浏览器弹窗只显示名称以关键字开头的设备
      const options={optionalServices:COMMON_SERVICES};
      if(keyword){
        options.filters=[{namePrefix:keyword}];
      }else{
        options.acceptAllDevices=true;
      }
      device=await navigator.bluetooth.requestDevice(options);
      device.addEventListener('gattserverdisconnected',onGattDisconnected);
      lastDevice=device;
      setStatus('connecting', device.name||device.id);
      await connectAndDiscover();
    }catch(err){
      console.error('BLE connect error:',err);
      if(err&&err.name==='NotFoundError'){
        // 用户在弹窗里取消了选择，静默回到未连接
        device=null; server=null;
        setStatus('disconnected','');
        showBleNotice('');
      }else{
        setStatus('disconnected','');
        showBleNotice('连接失败：'+(err&&err.message||err));
        logToPanel('Error','connect','连接失败: '+(err&&err.message||err));
      }
    }finally{
      connecting=false;
      syncConnectButtons();
    }
  });

  /**
   * 建链 + 特征发现的主流程。
   * 每一步都独立重试，并在中途掉线时自动补一次重连，最后给出明确结论。
   */
  async function connectAndDiscover(){
    const srv=await connectGattWithRetry();
    if(!srv){
      setStatus('disconnected','');
      showBleNotice('连接失败：多次尝试仍未建立 GATT 链路，请确认设备已开机并在范围内。');
      return false;
    }
    server=srv;
    setStatus('discovering', device.name||'未知设备');

    // 等服务树就绪（这是"连上了却枚举不到服务"的主因）
    await sleep(DISCOVER_SETTLE_MS);

    let ffe1=null, missing=[];
    for(let attempt=1; attempt<=DISCOVER_ATTEMPTS; attempt++){
      if(!device.gatt.connected){
        // settle 期间掉线：补一次重连后立即再试
        showBleNotice('链路在发现前掉线，正在重连…');
        const again=await connectGattWithRetry();
        if(!again){ break; }
        server=again;
        await sleep(DISCOVER_SETTLE_MS);
      }
      const t0=Date.now();
      const res=await discoverGATT(server);
      ffe1=res.ffe1;
      missing=res.missing;
      if(!ffe1 && attempt<DISCOVER_ATTEMPTS){
        logToPanel('Info','discover',`第 ${attempt} 次未发现 FFE1，${DISCOVER_RETRY_DELAYS[attempt-1]||300}ms 后重试…（用时 ${Date.now()-t0}ms）`);
        showBleNotice(`未发现 FFE1 特征，正在重试（第 ${attempt+1}/${DISCOVER_ATTEMPTS} 次）…`);
        await sleep(DISCOVER_RETRY_DELAYS[attempt-1]||300);
        continue;
      }
      break;
    }

    if(ffe1){
      setStatus('connected', device.name||'未知设备');
      showBleNotice('');
      return true;
    }
    // 链路在但关键特征缺失：不谎报"已连接"，也不静默
    setStatus('partial', device.name||'未知设备');
    showBleNotice('已连接，但未发现 FFE1 特征'+(missing.length?`（缺失：${missing.join(' / ')}）`:'')+
      '，可能该设备不走 Nordic UART 协议；可点右侧重试，或到设备端确认服务是否已广播。', true);
    return false;
  }

  /**
   * 带重试的 GATT 建链。
   * 处理两类抖动：connect() 抛错；connect() 成功但紧接着掉线（返回后立即校验）。
   * 成功返回 server，失败返回 null。
   */
  async function connectGattWithRetry(){
    for(let attempt=1; attempt<=CONNECT_ATTEMPTS; attempt++){
      try{
        if(!device.gatt.connected) await device.gatt.connect();
        if(device.gatt.connected){
          return device.gatt;
        }
        throw new Error('连接后立即断开');
      }catch(err){
        const last=attempt===CONNECT_ATTEMPTS;
        console.warn(`GATT connect attempt ${attempt} failed:`,err&&err.message||err);
        logToPanel('Error','connect',`连接尝试 ${attempt}/${CONNECT_ATTEMPTS} 失败: ${err&&err.message||err}`);
        if(last){
          return null;
        }
        showBleNotice(`连接不稳定，正在重试（第 ${attempt+1}/${CONNECT_ATTEMPTS} 次）…`);
        await sleep(CONNECT_RETRY_DELAYS[attempt-1]||500);
      }
    }
    return null;
  }

  // ---- Disconnect ----
  btnDisconnect.addEventListener('click', ()=>{
    userDisconnect=true;
    showBleNotice('');
    if(device&&device.gatt.connected) device.gatt.disconnect();
    else onDeviceLost(true);
  });

  // ---- 手动重试发现特征 ----
  btnRetryDiscover.addEventListener('click', async ()=>{
    if(connecting||!device) return;
    connecting=true;
    syncConnectButtons();
    showBleNotice('正在重新发现特征…');
    try{
      if(!device.gatt.connected){
        const srv=await connectGattWithRetry();
        if(!srv){ setStatus('disconnected',''); showBleNotice('重连失败，请重新连接设备。'); return; }
        server=srv;
        await sleep(DISCOVER_SETTLE_MS);
      }
      const res=await discoverGATT(server);
      if(res.ffe1){
        setStatus('connected', device.name||'未知设备');
        showBleNotice('');
      }else{
        setStatus('partial', device.name||'未知设备');
        showBleNotice('仍未发现 FFE1 特征'+(res.missing.length?`（缺失：${res.missing.join(' / ')}）`:'')+'。');
      }
    }catch(err){
      setStatus('partial', device.name||'未知设备');
      showBleNotice('重新发现失败：'+(err&&err.message||err));
    }finally{
      connecting=false;
      syncConnectButtons();
    }
  });

  // ---- Clear GATT cache (force fresh re-discovery next connect) ----
  btnClearCache.addEventListener('click', async ()=>{
    if(!lastDevice){
      alert('当前没有可清除缓存的设备记录，请先连接一次该设备。');
      return;
    }
    if(typeof lastDevice.forget!=='function'){
      alert('当前浏览器不支持 device.forget()，无法从网页清除 GATT 缓存。\n可到系统蓝牙设置中“忽略/移除”该设备后再试。');
      return;
    }
    try{
      await lastDevice.forget();
      logToPanel('Cache','--','已清除设备缓存，下次连接将重新识别 GATT');
      btnClearCache.disabled=true;
      lastDevice=null;
      // forget 会触发断开，onGattDisconnected 已复位 UI；若仍连着则主动断开
      userDisconnect=true;
      if(device&&device.gatt&&device.gatt.connected) device.gatt.disconnect();
    }catch(err){
      alert('清除缓存失败: '+err.message);
    }
  });

  /**
   * gattserverdisconnected 事件入口。
   * 掉线后（无论主动还是意外）一律**彻底释放 device**，使下一次点「连接」必定重新弹出
   * 设备选择窗口（用户明确要求：每次都自己选设备）。绝不自动重连。
   */
  function onGattDisconnected(){
    userDisconnect=false;
    // 始终按「彻底释放」处理：onDeviceLost(true) 保证 device=null
    onDeviceLost(true);
    showBleNotice('设备连接已断开，请点击「连接」重新选择设备连接。');
    logToPanel('Error','connect','设备连接已断开（不自动重连，请手动重新选择设备）');
  }

  /**
   * 复位连接相关 UI，并释放 device（下次连接必须重新选择设备）。
   * @param {boolean} fromUser 保留参数以兼容调用点；两种取值行为一致（均释放 device）
   */
  function onDeviceLost(fromUser){
    // 停止所有轮询/订阅
    activePolls.forEach(id=>clearInterval(id));
    activePolls.clear();
    activeSubs.forEach((rec,ch)=>{ try{ ch.removeEventListener('characteristicvaluechanged',rec.handler); }catch(e){} });
    activeSubs.clear();
    // 复位 GATT Profile 到初始状态（与主动断开保持一致）
    gattTree.innerHTML='<div style="color:var(--text-light);text-align:center;padding:40px 0;font-size:.875rem;">连接设备后将显示 GATT 服务与特征值</div>';
    setStatus('disconnected','');
    // 掉线一律释放 device（调用方均传 true），下次点「连接」必须重新选设备。
    // lastDevice 不动 —— 它专供 btnClearCache 使用。
    device=null;
    server=null;
    syncConnectButtons();
  }

  function setStatus(state, name){
    const cls = state==='discovering' ? 'connected discovering' : state;
    bleStatus.className='status-badge '+cls;
    bleStatusText.textContent={disconnected:'未连接',connecting:'连接中...',connected:'已连接',discovering:'发现特征中...',partial:'已连接(特征不全)'}[state]||'未连接';
    if(name) bleDeviceName.innerHTML='设备: <strong>'+Utils.escapeHtml(name)+'</strong>';
    else bleDeviceName.innerHTML='';
  }

  // ---- GATT Discovery ----
  /**
   * 发现服务与特征。
   * 一次 getPrimaryServices() + 并发 getCharacteristics() 拿到全部特征后本地匹配，
   * 避免对同一服务树反复枚举放大时序抖动（这是首次枚举不全的诱因）。
   * @returns {{ffe1:?object, missing:string[], ms:number}}
   */
  async function discoverGATT(server){
    const t0=Date.now();
    gattTree.innerHTML='<div style="color:var(--text-muted);padding:12px;">正在发现服务...</div>';
    let ffe1Char=null;
    try{
      const services=await server.getPrimaryServices();
      gattTree.innerHTML='';
      for(const svc of services){
        const svcDiv=document.createElement('div');
        svcDiv.className='gatt-service';
        const isFFE1=svc.uuid===FFE1_SERVICE;
        svcDiv.innerHTML=`
          <div class="gatt-service-header">
            <span class="arrow">▶</span>
            <span>${Utils.formatUuid(svc.uuid)}</span>
            <span style="font-family:monospace;font-size:.75rem;color:var(--text-muted);">${Utils.shortUuid(svc.uuid)}</span>
          </div>
          <div class="gatt-service-body"></div>`;
        const body=svcDiv.querySelector('.gatt-service-body');
        svcDiv.querySelector('.gatt-service-header').addEventListener('click',()=>svcDiv.classList.toggle('expanded'));

        let chars=[];
        try{
          chars=await svc.getCharacteristics();
        }catch(err){
          logToPanel('Error','gatt',`读取服务 ${Utils.shortUuid(svc.uuid)} 的特征失败: ${err&&err.message||err}`);
          continue;
        }
        {
          for(const ch of chars){
            if(ch.uuid===FFE1_SERVICE) ffe1Char=ch;
            const charDiv=document.createElement('div');
            charDiv.className='gatt-char';
            const props=getPropList(ch);
            const writable=props.includes('write');
            const shortU=Utils.shortUuid(ch.uuid);
            charDiv.innerHTML=`
              <span class="char-uuid">${shortU}</span>
              ${props.map(p=>`<span class="char-prop ${p}">${p}</span>`).join('')}
              ${ch.properties.read?`
                <button class="btn btn-sm char-read-btn">读取</button>
                <button class="btn btn-sm char-poll-btn">轮询</button>
                <input class="poll-interval" type="number" value="1000" min="500" step="100" title="轮询间隔(ms)">ms
              `:''}
              ${(ch.properties.notify||ch.properties.indicate)?`
                <button class="btn btn-sm char-sub-btn">订阅</button>
              `:''}
              ${writable?`
                <button class="btn btn-sm char-send-btn">发送</button>
                <span class="char-send-panel" style="display:none;width:100%;margin-top:4px;gap:6px;align-items:center;flex-wrap:wrap;">
                  <input class="char-send-input" type="text" placeholder="16进制，如 A0 0B 02 / A00B02" style="flex:1;min-width:160px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;font-family:'Consolas','Monaco',monospace;font-size:.75rem;">
                  <label style="font-size:.7rem;color:var(--text-muted);display:inline-flex;align-items:center;gap:3px;white-space:nowrap;">
                    <input type="checkbox" class="char-send-ascii"> ASCII
                  </label>
                  <button class="btn btn-sm char-send-go">发送</button>
                </span>
              `:''}`;
            if(ch.properties.read){
              const readBtn=charDiv.querySelector('.char-read-btn');
              const pollBtn=charDiv.querySelector('.char-poll-btn');
              const intervalInput=charDiv.querySelector('.poll-interval');

              async function doRead(prefix){
                try{
                  const dv=await ch.readValue();
                  logToPanel(prefix,shortU,formatDataView(dv));
                }catch(err){
                  // 设备已断开则停止该轮询，避免持续报错
                  if(!device||!device.gatt||!device.gatt.connected){
                    if(activePolls.has(ch)){clearInterval(activePolls.get(ch));activePolls.delete(ch);}
                    return;
                  }
                  logToPanel(prefix+'-Err',shortU,err.message);
                }
              }

              // Read once
              readBtn.addEventListener('click',async(e)=>{
                e.stopPropagation();
                readBtn.textContent='...';
                await doRead('Read');
                readBtn.textContent='读取';
              });

              // Toggle polling
              pollBtn.addEventListener('click',(e)=>{
                e.stopPropagation();
                if(activePolls.has(ch)){
                  clearInterval(activePolls.get(ch));
                  activePolls.delete(ch);
                  pollBtn.textContent='轮询';
                  pollBtn.classList.remove('btn-danger');
                }else{
                  let ms=parseInt(intervalInput.value)||1000;
                  if(ms<500){ms=500;intervalInput.value=500;}
                  doRead('Poll');
                  activePolls.set(ch,setInterval(()=>doRead('Poll'),ms));
                  pollBtn.textContent='停止';
                  pollBtn.classList.add('btn-danger');
                }
              });

              // Interval change — restart if polling
              intervalInput.addEventListener('change',()=>{
                let ms=parseInt(intervalInput.value)||1000;
                if(ms<500){ms=500;intervalInput.value=500;}
                if(activePolls.has(ch)){
                  clearInterval(activePolls.get(ch));
                  doRead('Poll');
                  activePolls.set(ch,setInterval(()=>doRead('Poll'),ms));
                }
              });
            }
            // 真正的 notify/indicate 订阅：按钮手动触发，不再自动订阅
            if(ch.properties.notify||ch.properties.indicate){
              const subBtn=charDiv.querySelector('.char-sub-btn');
              subBtn.addEventListener('click',(e)=>{
                e.stopPropagation();
                toggleSubscribe(ch, shortU, subBtn, charDiv);
              });
            }
            // 可写特征：显示「发送」功能（默认 16 进制，勾选 ASCII 按文本发送）
            if(writable){
              const sendBtn=charDiv.querySelector('.char-send-btn');
              const panel=charDiv.querySelector('.char-send-panel');
              const input=charDiv.querySelector('.char-send-input');
              const asciiChk=charDiv.querySelector('.char-send-ascii');
              const sendGo=charDiv.querySelector('.char-send-go');
              // 切换发送面板显隐
              sendBtn.addEventListener('click',(e)=>{
                e.stopPropagation();
                panel.style.display = panel.style.display==='none' ? 'flex' : 'none';
                if(panel.style.display==='flex') input.focus();
              });
              // 执行发送
              const doSend=async ()=>{
                const raw=input.value.trim();
                if(!raw){ logToPanel('Req-Err',shortU,'发送内容为空'); return; }
                let bytes;
                try{
                  bytes = asciiChk.checked ? new TextEncoder().encode(raw) : hexToBytes(raw);
                }catch(err){
                  logToPanel('Req-Err',shortU,err.message);
                  return;
                }
                if(bytes.length===0){ logToPanel('Req-Err',shortU,'发送内容为空'); return; }
                sendGo.textContent='...'; sendGo.disabled=true;
                try{
                  if(ch.properties.write) await ch.writeValue(bytes);
                  else if(ch.properties.writeWithoutResponse) await ch.writeValueWithoutResponse(bytes);
                  const shown = asciiChk.checked ? ('ASCII: '+raw)
                    : (bytes.length<=64 ? Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join(' ') : (bytes.length+' 字节'));
                  logToPanel('Req', shortU, shown);
                }catch(err){
                  logToPanel('Req-Err',shortU,err.message);
                }finally{
                  sendGo.textContent='发送'; sendGo.disabled=false;
                }
              };
              sendGo.addEventListener('click',(e)=>{ e.stopPropagation(); doSend(); });
              input.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.stopPropagation(); doSend(); } });
            }
            body.appendChild(charDiv);
          }
        }
        // Auto-expand FFE1
        if(isFFE1||svc.uuid==='0000ffe0-0000-1000-8000-00805f9b34fb') svcDiv.classList.add('expanded');
        gattTree.appendChild(svcDiv);
      }
      if(services.length===0) gattTree.innerHTML='<div style="color:var(--text-light);padding:20px;text-align:center;">未发现任何服务</div>';
    }catch(err){
      gattTree.innerHTML='<div style="color:var(--danger);padding:12px;">发现服务失败: '+Utils.escapeHtml(err.message)+'</div>';
      logToPanel('Error','gatt','发现服务失败: '+(err&&err.message||err));
    }
    // 关键特征存在性汇总（供上层重试与提示使用）
    const missing=[];
    if(!ffe1Char) missing.push('FFE1');
    return {ffe1:ffe1Char, missing, ms:Date.now()-t0};
  }

  function getPropList(ch){
    const p=ch.properties;
    const list=[];
    if(p.read) list.push('read');
    if(p.write) list.push('write');
    if(p.writeWithoutResponse) list.push('write');
    if(p.notify) list.push('notify');
    if(p.indicate) list.push('indicate');
    if(p.broadcast) list.push('other');
    return list;
  }

  function formatDataView(dv){
    const arr=[];
    for(let i=0;i<dv.byteLength;i++) arr.push(dv.getUint8(i));
    // Try as text first
    const text=arr.map(b=>String.fromCharCode(b)).join('');
    if(/^[\x20-\x7e\r\n\t]+$/.test(text)) return text.trim().substring(0,40);
    return arr.map(b=>b.toString(16).padStart(2,'0')).join(' ');
  }

  // 16进制字符串 → Uint8Array。
  // 支持 "A0 0B 02" / "A00B02" / "a0,0b,02" 等分隔形式；空或非偶数长度/非 hex 字符抛错。
  function hexToBytes(str){
    const cleaned=str.replace(/[\s,]/g,'').toLowerCase();
    if(cleaned.length===0) throw new Error('空内容');
    if(cleaned.length%2!==0) throw new Error('16进制长度必须为偶数（每字节 2 位）');
    if(!/^[0-9a-f]*$/.test(cleaned)) throw new Error('包含非 16进制字符');
    const out=new Uint8Array(cleaned.length/2);
    for(let i=0;i<out.length;i++) out[i]=parseInt(cleaned.substr(i*2,2),16);
    return out;
  }

  // ---- BLE Data Handling ----

  // Log read/poll results to the panel with timestamp
  function logCategory(prefix){
    if(prefix==='Req') return 'out';                          // 发送
    if(prefix==='Data'||prefix==='Raw'||prefix==='Notify') return 'in'; // 接收
    if(prefix==='Req-Err'||prefix==='Err'||prefix==='Error'||prefix==='Timeout'||prefix==='Sub-Err') return 'err'; // 错误
    return 'sys';                                            // CMD / Sub / Cache 等系统信息
  }

  function pushLogLine(text, cls){
    bleRawLines.push(text);
    if(bleRawLines.length>MAX_RAW){
      bleRawLines.shift();
      if(rawLog.firstChild) rawLog.removeChild(rawLog.firstChild);
    }
    const div=document.createElement('div');
    div.className='log-line '+cls;
    div.textContent=text;
    rawLog.appendChild(div);
    rawLog.scrollTop=rawLog.scrollHeight;
    logLineCount.textContent=bleRawLines.length;
    btnExportLog.disabled=false;
  }

  function logToPanel(prefix,uuid,value){
    const now=new Date();
    const ts=now.toLocaleTimeString('zh-CN',{hour12:false})+'.'+String(now.getMilliseconds()).padStart(3,'0');
    const line=`[${prefix} ${uuid} @ ${ts}] ${value}`;
    pushLogLine(line, 'log-'+logCategory(prefix));
  }

  // notify/indicate 事件：每帧独立记录，二进制显示十六进制，文本显示 ASCII（不乱码）
  function onNotifyChanged(event, uuid){
    const dv=event.target.value;
    const formatted=formatDataView(dv);
    logToPanel('Notify', uuid, formatted);
  }

  // 订阅/取消订阅 notify（真正订阅，区别于轮询读取）
  async function toggleSubscribe(ch, shortU, subBtn, charDiv){
    if(activeSubs.has(ch)){
      // 停止订阅
      try{ await ch.stopNotifications(); }catch(err){}
      const rec=activeSubs.get(ch);
      if(rec){ try{ ch.removeEventListener('characteristicvaluechanged',rec.handler); }catch(e){} }
      activeSubs.delete(ch);
      subBtn.textContent='订阅';
      subBtn.classList.remove('btn-danger');
      const mark=charDiv.querySelector('.sub-mark');
      if(mark) mark.remove();
      charDiv.style.background='';
      logToPanel('Sub',shortU,'已停止订阅 notify');
    }else{
      // 开始订阅
      try{
        await ch.startNotifications();
        const handler=(e)=>onNotifyChanged(e, shortU);
        ch.addEventListener('characteristicvaluechanged', handler);
        activeSubs.set(ch,{handler});
        subBtn.textContent='停止';
        subBtn.classList.add('btn-danger');
        if(!charDiv.querySelector('.sub-mark')){
          charDiv.insertAdjacentHTML('afterbegin','<span class="sub-mark" style="font-size:.7rem;color:var(--ble-color);font-weight:600;">● 监听中</span>');
        }
        charDiv.style.background='var(--ble-soft)';
        logToPanel('Sub',shortU,'已订阅 notify');
      }catch(err){
        logToPanel('Sub-Err',shortU,err.message);
        alert('订阅失败: '+err.message);
      }
    }
  }

  // ---- Clear log ----
  btnClearLog.addEventListener('click',()=>{
    bleRawLines=[];
    bleBuffer='';
    rawLog.innerHTML='';
    logLineCount.textContent='0';
    btnExportLog.disabled=true;
  });

  // ---- Export log ----
  btnExportLog.addEventListener('click',()=>{
    if(bleRawLines.length===0) return;
    const content=bleRawLines.join('\n')+'\n';
    const blob=new Blob([content],{type:'text/plain'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    const now=new Date();
    const ts=now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate())+'_'+pad(now.getHours())+pad(now.getMinutes())+pad(now.getSeconds());
    a.download='ble_log_'+ts+'.log';
    a.click();
    URL.revokeObjectURL(url);
  });
  function pad(n){return String(n).padStart(2,'0');}

  // ---- 顶部吸顶条：滚动后毛玻璃底 + 标题收进顶栏（与 JNA / JNC 工具同款交互） ----
  const topbar=document.getElementById('topbar');
  function syncTopbar(){
    if(topbar) topbar.classList.toggle('scrolled', window.scrollY > 40);
  }
  window.addEventListener('scroll', syncTopbar, {passive:true});
  syncTopbar();
})();
</script>
</body>
